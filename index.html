<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Archive Player</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <h1>Radio Archive Audio Player</h1>

    <!-- Embedded Playlist -->
    <section id="playlist">
        <h2>Audio Playlist</h2>
        <iframe 
            src="radioarchive_playlist.html" 
            width="100%" 
            height="500" 
            frameborder="0" 
            allowfullscreen>
        </iframe>
    </section>

    <!-- Internet Archive iframe -->
    <section id="archive-iframe">
        <h2>Explore More on Internet Archive</h2>
        <iframe 
            src="https://archive.org/embed/radioarchive.cx" 
            width="100%" 
            height="600" 
            frameborder="0" 
            allowfullscreen>
        </iframe>
    </section>

    <footer>
        <p>&copy; 2024 Radio Archive | Powered by Internet Archive</p>
    </footer>
</body>
</html>
